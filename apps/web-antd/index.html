<!doctype html>
<html dir="rtl" lang="fa-IR">
  <head>
    <meta charset="UTF-8" />
    <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0" name="viewport" />
    <meta content="Vben Admin React — قالب مدیریتی با React، Ant Design و TypeScript" name="description" />
    <meta content="never" name="referrer" />
    <link href="/favicon.svg" rel="icon" type="image/svg+xml" />
    <title>%VITE_APP_TITLE%</title>
    <!-- ترتیب لایه‌های CSS باید پیش از تزریق استایل‌های antd اعلام شود -->
    <style>
      @layer properties, theme, base, antd, components, utilities;
    </style>
    <style data-app-loading="inject-css">
      html {
        line-height: 1.15;
      }

      .loading {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: #f4f7f9;
        transition: opacity 0.6s;
      }

      .loading.hidden {
        visibility: hidden;
        opacity: 0;
      }

      html.dark .loading {
        background: #0d0d10;
      }

      .loading .title {
        margin-top: 46px;
        font-family: tahoma, sans-serif;
        font-size: 26px;
        font-weight: 600;
        color: rgb(0 0 0 / 85%);
      }

      html.dark .loading .title {
        color: #fff;
      }

      .loader {
        position: relative;
        width: 48px;
        height: 48px;
      }

      .loader::before {
        position: absolute;
        top: 60px;
        left: 0;
        width: 48px;
        height: 5px;
        content: '';
        background: hsl(var(--primary, 212 100% 45%) / 50%);
        border-radius: 50%;
        animation: shadow-ani 0.5s linear infinite;
      }

      .loader::after {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        content: '';
        background: hsl(var(--primary, 212 100% 45%));
        border-radius: 4px;
        animation: jump-ani 0.5s linear infinite;
      }

      @keyframes jump-ani {
        15% {
          border-bottom-right-radius: 3px;
        }

        25% {
          transform: translateY(9px) rotate(22.5deg);
        }

        50% {
          border-bottom-right-radius: 40px;
          transform: translateY(18px) scale(1, 0.9) rotate(45deg);
        }

        75% {
          transform: translateY(9px) rotate(67.5deg);
        }

        100% {
          transform: translateY(0) rotate(90deg);
        }
      }

      @keyframes shadow-ani {
        0%,
        100% {
          transform: scale(1, 1);
        }

        50% {
          transform: scale(1.2, 1);
        }
      }
    </style>
    <script data-app-loading="inject-js">
      // اعمال سریع تم ذخیره‌شده برای جلوگیری از چشمک زدن
      (function () {
        try {
          var ns = '%VITE_APP_NAMESPACE%';
          var raw = localStorage.getItem(ns + '-preferences-theme');
          var mode = raw ? JSON.parse(raw).value : 'dark';
          var dark = mode === 'dark' || (mode === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', dark);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="app">
      <div class="loading" id="__app-loading__">
        <div class="loader"></div>
        <div class="title">%VITE_APP_TITLE%</div>
      </div>
    </div>
    <script src="/src/main.tsx" type="module"></script>
  </body>
</html>
